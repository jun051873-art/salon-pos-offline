    <script id="salon-startup-guard">

      function report(message) {
        if (document.querySelector('.app-shell')) return;
        var panel = document.getElementById('startup-status');
        if (panel) { panel.hidden = false; panel.textContent = '系統啟動未完成，原有資料未清除。\n錯誤資訊：' + String(message || '未知錯誤') + '\n請將此畫面提供給維護人員；不要清除瀏覽器資料。'; }
      }
      window.addEventListener('error', function (event) { report(event.message); });
      window.addEventListener('unhandledrejection', function (event) { report(event.reason && event.reason.message || event.reason); });
      if (!Object.hasOwn) Object.hasOwn = function (object, key) { return Object.prototype.hasOwnProperty.call(object, key); };
      setTimeout(function () { if (!document.querySelector('.app-shell') && document.getElementById('root').textContent.indexOf('正在開啟') !== -1) report('程式尚未成功載入'); }, 10000);
    })();
